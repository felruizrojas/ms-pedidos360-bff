name: Deploy bff a EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Compilar y correr tests
        run: ./mvnw clean verify

      - name: Copiar jar a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'target/ms-pedidos360-bff-0.0.1-SNAPSHOT.jar'
          target: '/opt/pedidos360/bff'
          strip_components: 1

      - name: Renombrar jar y reiniciar servicio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mv /opt/pedidos360/bff/ms-pedidos360-bff-0.0.1-SNAPSHOT.jar /opt/pedidos360/bff/app.jar
            sudo systemctl restart pedidos360-bff
            sleep 5
            sudo systemctl status pedidos360-bff --no-pager
