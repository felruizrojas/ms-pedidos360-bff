# BFF. En la EC2 se usa este archivo tal cual (imagen de GHCR);
# en local se suma docker-compose.override.yml, que compila la imagen desde el código.
# Variables: copiar .env.example a .env (en la EC2 el .env lo crea CloudFormation).
services:
  bff:
    image: ${BFF_IMAGE:-ghcr.io/felruizrojas/ms-pedidos360-bff:latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:?falta CATALOG_BASE_URL en .env}
      ORDERS_BASE_URL: ${ORDERS_BASE_URL:?falta ORDERS_BASE_URL en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENFORCE_ROLES: ${ENFORCE_ROLES:-false}
      # Vista de usuarios: sin GRAPH_CLIENT_SECRET, GET /api/users responde 503 (el resto funciona igual).
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      ACCESOS_ARCHIVO: /app/data/accesos.json
    volumes:
      - bff-data:/app/data
    mem_limit: 768m

volumes:
  bff-data:
